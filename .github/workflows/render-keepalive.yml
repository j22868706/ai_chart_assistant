name: Render keepalive

on:
  schedule:
    # Every 10 minutes, offset from the busiest start-of-hour window (UTC).
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-keepalive.yml'

permissions: {}

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  health:
    if: github.repository == 'j22868706/ai_chart_assistant' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request Render health endpoint
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          url = "https://ai-chart-assistant.onrender.com/health"
          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(
                      url, headers={"User-Agent": "ai-chart-assistant-keepalive"}
                  )
                  with urllib.request.urlopen(request, timeout=70) as response:
                      if response.status != 200:
                          raise RuntimeError("Unexpected health status")
                      if json.loads(response.read(4096)) != {"status": "ok"}:
                          raise RuntimeError("Unexpected health response")
                  print("Render health check passed (HTTP 200).")
                  break
              except Exception as error:
                  print(f"Attempt {attempt}/3 failed: {type(error).__name__}")
                  if attempt == 3:
                      raise SystemExit("Render health check failed.") from None
                  time.sleep(5)
          PY
